name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement
        default: production
        type: choice
        options: [production]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/souhilaachour/evaluation-devops

jobs:
  build-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - name: Verification du code
        run: ruff check .

      - name: Connexion au registry GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push avec 3 tags
        run: |
          SHA=${GITHUB_SHA::7}
          docker build --build-arg GIT_SHA=$SHA -t $IMAGE:latest -t $IMAGE:$SHA -t $IMAGE:1.0.${{ github.run_number }} .
          docker push --all-tags $IMAGE

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registry GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sauvegarder la version actuelle
        run: docker ps --filter "name=evaluation-api" --format "{{.Image}}" | Out-File precedente.txt -Encoding ascii

      - name: Deployer la nouvelle version
        run: |
          $env:IMAGE_API = $env:IMAGE + ":" + $env:GITHUB_SHA.Substring(0,7)
          docker compose -f docker-compose.prod.yml pull api
          docker compose -f docker-compose.prod.yml up -d

      - name: Healthcheck avec 3 retries
        run: |
          Start-Sleep -Seconds 10
          curl.exe --fail --retry 3 --retry-delay 10 --retry-all-errors http://localhost:8000/health

      - name: Rollback si le healthcheck echoue
        if: failure()
        run: |
          $env:IMAGE_API = Get-Content precedente.txt
          docker compose -f docker-compose.prod.yml pull api
          docker compose -f docker-compose.prod.yml up -d