name: Preparer Python
description: Installe Python avec le cache pip puis installe les dependances
inputs:
  python-version:
    description: Version de Python a installer
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - name: Installer Python avec le cache pip
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Installer les dependances
      shell: bash
      run: pip install -r requirements-dev.txt